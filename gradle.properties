android.useAndroidX=true
org.gradle.jvmargs=-Xms256m -Xmx4096m

# Fixed versionCode for builds without git history (e.g. the TAK.gov Third Party Pipeline).
# Scheme: major*10000 + minor*100 + patch, so 1.3 = 10300, 1.3.1 = 10301, 1.4 = 10400.
# Increase it on every release, or ATAK will not install the update over the old version.
takStaticVersion=10400
